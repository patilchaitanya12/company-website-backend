[project]
name = "apex-engineering-backend"
version = "0.1.0"
description = "Apex Engineering Works - company website backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "cloudinary>=1.41.0",
    "python-multipart>=0.0.12",
    "psycopg2>=2.9.12",
    "bcrypt>=5.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]
